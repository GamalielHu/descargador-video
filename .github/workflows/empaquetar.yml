name: Empaquetar extensión
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar y comprimir
        run: |
          python3 -c "import json;json.load(open('manifest.json'))"
          for f in *.js; do node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"; done
          zip -r descargador-video.zip manifest.json *.js *.html
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.${{ github.run_number }}" descargador-video.zip \
            --title "Descargador de Video v1.${{ github.run_number }}" \
            --notes "Descomprime el zip y en chrome://extensions activa Modo desarrollador → Cargar descomprimida."
